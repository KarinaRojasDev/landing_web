<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css">
    <title>Contacto - Portfolio</title>
</head>

<body>
    <header>
        <nav>
            <a href="../index.html">Inicio</a>
            <a href="../index.html#contacto">Contacto</a>
            <a href="./proyectos.html">Proyectos</a>
        </nav>
    </header>

    <main class="principal-oscuro">
        <section id="contacto-formulario" class="proy-sect">
            <h1>Contacto</h1>
            <p>Si estás interesado en mi portfolio, envíame un mensaje:</p>
            <form class="formulario-contacto" action="#" method="POST">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required class="input-contacto">

                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" placeholder="tu@email.com" required class="input-contacto">

                <label for="mensaje">Mensaje</label>
                <textarea id="mensaje" name="mensaje" rows="5" placeholder="Escribe tu mensaje..." required
                    class="input-contacto"></textarea>

                <button type="submit" class="boton-contacto">Enviar</button>
            </form>
        </section>
    </main>

    <footer>
        <p>© 2026 Karina Rojas. Todos los derechos reservados.</p>
    </footer>

    <script src="./script.js"></script>
</body>

</html>
